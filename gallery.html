<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nostalgia Desktop: gallery</title>
<meta name="description" content="A gallery of Nostalgia Desktop, the 1996 to 2005 computer in your browser.">
<style>
:root{--ink:#f3eee0;--dim:#a39c88;--bg:#0d0d0f;--film:#151311;--hole:#d8d2c3;--accent:#ffe45e}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 30%,#23201b 0,var(--bg) 70%);color:var(--ink);font:15px/1.4 "Helvetica Neue",Helvetica,Arial,sans-serif}
header{display:flex;align-items:baseline;gap:14px;padding:14px 22px 0}
header h1{margin:0;font:italic 800 22px Georgia,"Times New Roman",serif;letter-spacing:-.3px}
header h1 b{color:var(--accent);font-weight:800}
header a{color:var(--dim);font-size:13px;text-decoration:none}
header a:hover{color:var(--ink);text-decoration:underline}
header .sp{margin-left:auto}
main{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px 70px 6px;position:relative}
.stage{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
.stage img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;box-shadow:0 14px 50px rgba(0,0,0,.7);cursor:pointer;background:#000}
.cap{text-align:center;min-height:44px}
.cap b{display:block;font:700 18px Georgia,serif}
.cap span{color:var(--dim);font-size:13px}
.nav{position:absolute;top:50%;transform:translateY(-60%);width:46px;height:46px;border-radius:50%;border:1px solid #444;background:rgba(20,18,16,.8);color:var(--ink);font-size:20px;cursor:pointer}
.nav:hover{background:#2c2822;border-color:var(--accent)}
.nav.prev{left:12px}.nav.next{right:12px}
.count{position:absolute;top:14px;right:76px;font:12px var(--ui,Arial);color:var(--dim);letter-spacing:1px}
/* the film strip */
.strip{flex:none;background:var(--film);border-top:1px solid #2a2622;border-bottom:1px solid #2a2622;padding:0}
.reel{display:flex;gap:10px;overflow-x:auto;padding:12px 14px;scroll-behavior:smooth;scrollbar-width:thin;scrollbar-color:#555 #151311}
.frame{flex:none;position:relative;width:176px;height:110px;padding:0;border:3px solid #000;border-radius:3px;background:#000;cursor:pointer;opacity:.62;transition:opacity .15s,transform .15s}
.frame img{display:block;width:100%;height:100%;object-fit:cover}
.frame:hover{opacity:.95}
.frame.on{opacity:1;outline:3px solid var(--accent);outline-offset:1px;transform:translateY(-2px)}
.frame i{display:none;position:absolute;left:4px;bottom:3px;font:700 10px Arial,sans-serif;font-style:normal;color:#ffb347;text-shadow:0 1px 2px #000}
@media (max-width:700px){main{padding:10px 12px 4px}.nav{display:none}.count{right:14px}.frame{width:128px;height:80px}}
</style>
</head>
<body>
<header>
  <h1>Nostalgia <b>Desktop</b></h1>
  <span style="color:var(--dim);font-size:13px">gallery</span>
  <a class="sp" href="./">Open the desktop</a>
  <a href="https://github.com/hertn/nostalgia-desktop">GitHub</a>
</header>
<main>
  <div class="count" id="count"></div>
  <button class="nav prev" id="prev" aria-label="Previous picture">&#9664;</button>
  <div class="stage"><img id="big" alt=""></div>
  <div class="cap"><b id="ttl"></b><span id="sub"></span></div>
  <button class="nav next" id="next" aria-label="Next picture">&#9654;</button>
</main>
<div class="strip">
  <div class="reel" id="reel" role="listbox" aria-label="Pictures"></div>
</div>
<script>
const SHOTS = [
  ['boot', 'Start-up', 'Press the power button. The year pills fill in as it boots.'],
  ['oldweb', 'Old Web', 'It opens on the day on your clock: the number one song, the box office, the headlines.'],
  ['tvguide', 'TV Guide, a Saturday morning', 'Printed-style listings for any week from 1996 to 2005, rebuilt page by page. Here is the Saturday cartoon block.'],
  ['tvguide-scan', 'TV Guide, a real issue', 'Scans of actual TV Guides from the Internet Archive open in the same viewer. January 1998.'],
  ['catalog', 'Catalog', 'The real 2005 JCPenney Christmas Book, page-flipping like a PDF, with zoom and full screen.'],
  ['movienight', 'Movie Night shelf', 'Your watchlist on a video store shelf. Pick boxes and it plans the night, with an intermission.'],
  ['movieguide', 'Movie Guide', "Tonight's double feature: two tickets, the running time, and snacks."],
  ['tv', 'TV', 'An old set with channels to flip through.'],
  ['utunes', 'uTunes', 'The Billboard year-end Hot 100 for every year, 1996 to 2005.'],
  ['quickshow', 'QuickShow', 'Trailers and show openings play in a little player.'],
  ['nim', 'NIM', 'Buddy list, chat rooms and profile pages, with bots that say so.'],
  ['mail', 'Mail', "You've got mail."],
  ['blockfall', 'Arcade', 'Snake, Minefield, Blockfall and a Pixel Pet.']
];
const $ = (s) => document.querySelector(s), big = $('#big'), reel = $('#reel');
let cur = 0;
SHOTS.forEach(([f, t], i) => {
  const b = document.createElement('button'); b.className = 'frame'; b.type = 'button'; b.setAttribute('role', 'option'); b.title = t;
  const im = new Image(); im.src = 'screenshots/thumbs/' + f + '.jpg'; im.alt = t; im.loading = 'lazy';
  b.append(im); b.onclick = () => show(i); reel.appendChild(b);
});
function show(i, keep) {
  cur = (i + SHOTS.length) % SHOTS.length; const [f, t, s] = SHOTS[cur];
  big.src = 'screenshots/' + f + '.png'; big.alt = t + '. ' + s; $('#ttl').textContent = t; $('#sub').textContent = s;
  $('#count').textContent = '' + String(cur + 1).padStart(2, '0') + ' / ' + SHOTS.length;
  [...reel.children].forEach((c, k) => { c.classList.toggle('on', k === cur); c.setAttribute('aria-selected', String(k === cur)); });
  const c = reel.children[cur]; reel.scrollTo({left: c.offsetLeft - reel.clientWidth / 2 + c.offsetWidth / 2});
  if (!keep) { try { history.replaceState(null, '', '#' + f); } catch (e) { /* file:// */ } }
  const nx = new Image(); nx.src = 'screenshots/' + SHOTS[(cur + 1) % SHOTS.length][0] + '.png';
}
$('#prev').onclick = () => show(cur - 1); $('#next').onclick = () => show(cur + 1); big.onclick = () => show(cur + 1);
addEventListener('keydown', (e) => { if (e.key === 'ArrowRight') show(cur + 1); else if (e.key === 'ArrowLeft') show(cur - 1); else if (e.key === 'Home') show(0); else if (e.key === 'End') show(SHOTS.length - 1); });
let x0 = null; big.addEventListener('touchstart', (e) => { x0 = e.touches[0].clientX; }, {passive: true});
big.addEventListener('touchend', (e) => { if (x0 == null) return; const d = e.changedTouches[0].clientX - x0; x0 = null; if (Math.abs(d) > 40) show(cur + (d < 0 ? 1 : -1)); });
const start = SHOTS.findIndex((s) => s[0] === location.hash.slice(1)); show(start >= 0 ? start : 0, true);
</script>
</body>
</html>
