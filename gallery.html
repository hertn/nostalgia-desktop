<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nostalgia Desktop: gallery</title>
<meta name="description" content="Screenshots of Nostalgia Desktop, the 1996 to 2005 computer in your browser.">
<style>
:root{--ink:#f3eee0;--dim:#a39c88;--bg:#0d0d0f;--accent:#ffe45e}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% 0,#23201b 0,var(--bg) 70%) fixed;color:var(--ink);font:15px/1.4 "Helvetica Neue",Helvetica,Arial,sans-serif;min-height:100vh}
header{display:flex;align-items:baseline;gap:14px;padding:18px 22px 6px;max-width:1200px;margin:0 auto}
header h1{margin:0;font:italic 800 24px Georgia,"Times New Roman",serif;letter-spacing:-.3px}
header h1 b{color:var(--accent)}
header a{color:var(--dim);font-size:13px;text-decoration:none}
header a:hover{color:var(--ink);text-decoration:underline}
header .sp{margin-left:auto}
.grid{max-width:1200px;margin:0 auto;padding:12px 22px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.grid figure{margin:0}
.grid button{display:block;width:100%;padding:0;border:0;background:#000;border-radius:8px;overflow:hidden;cursor:zoom-in;box-shadow:0 6px 22px rgba(0,0,0,.55);transition:transform .15s,box-shadow .15s}
.grid button:hover,.grid button:focus-visible{transform:translateY(-3px);box-shadow:0 12px 30px rgba(0,0,0,.7);outline:2px solid var(--accent)}
.grid img{display:block;width:100%;aspect-ratio:1400/860;object-fit:cover}
.grid figcaption{padding:7px 2px 0;font:700 14px Georgia,serif}
/* lightbox */
.lb{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px 70px;background:rgba(6,6,8,.93)}
.lb.open{display:flex}
.lb img{max-width:100%;min-height:0;flex:1;object-fit:contain;border-radius:8px;box-shadow:0 14px 50px rgba(0,0,0,.7)}
.lb .cap{text-align:center;max-width:760px}
.lb .cap b{display:block;font:700 18px Georgia,serif}
.lb .cap span{color:var(--dim);font-size:13px}
.lb button{position:absolute;width:46px;height:46px;border-radius:50%;border:1px solid #555;background:rgba(30,28,25,.85);color:var(--ink);font-size:20px;cursor:pointer}
.lb button:hover{border-color:var(--accent)}
.lb .prev{left:12px;top:50%}.lb .next{right:12px;top:50%}.lb .x{right:14px;top:14px;font-size:22px}
.lb .n{position:absolute;left:18px;top:20px;color:var(--dim);font-size:12px;letter-spacing:1px}
@media (max-width:700px){.lb{padding:60px 10px 20px}.lb .prev,.lb .next{top:auto;bottom:14px}}
</style>
</head>
<body>
<header>
  <h1>Nostalgia <b>Desktop</b></h1>
  <a class="sp" href="./">Open the desktop</a>
  <a href="https://github.com/hertn/nostalgia-desktop">GitHub</a>
  <a href="https://ko-fi.com/hertn">Ko-fi</a>
</header>
<div class="grid" id="grid"></div>
<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Picture viewer">
  <div class="n" id="n"></div>
  <button class="x" id="x" aria-label="Close">&times;</button>
  <button class="prev" id="prev" aria-label="Previous picture">&#9664;</button>
  <img id="big" alt="">
  <div class="cap"><b id="ttl"></b><span id="sub"></span></div>
  <button class="next" id="next" aria-label="Next picture">&#9654;</button>
</div>
<script>
const SHOTS = [
  ['boot', 'Start-up', 'Press the power button. The year pills fill in as it boots.'],
  ['oldweb', 'Old Web', 'It opens on the day on your clock: the number one song, the box office, the headlines.'],
  ['tvguide', 'TV Guide, a Saturday morning', 'Printed-style listings for any week from 1996 to 2005, rebuilt page by page. Here is the Saturday cartoon block.'],
  ['tvguide-scan', 'TV Guide, a real issue', 'Scans of actual TV Guides from the Internet Archive open in the same viewer. January 1998.'],
  ['catalog', 'Catalog', 'The real 2005 JCPenney Christmas Book, page-flipping like a PDF, with zoom and full screen.'],
  ['movienight', 'Movie Night shelf', 'Your watchlist on a video store shelf. Pick boxes and it plans the night, with an intermission.'],
  ['movieguide', 'Movie Guide', "Tonight's double feature: two tickets, the running time, and snacks."],
  ['tv', 'TV', 'Ten channels of real recordings from the year on the clock. Here, a commercial break from 2001.'],
  ['tv-wide', 'TV, maximized', 'The picture stays 4:3 between the speakers. Press F for full screen, or type a channel on the keypad.'],
  ['utunes', 'uTunes', 'The Billboard year-end Hot 100 for every year, 1996 to 2005.'],
  ['quickshow', 'QuickShow', 'Trailers and show openings play in a little player.'],
  ['nim', 'NIM', 'Buddy list, chat rooms and profile pages, with bots that say so.'],
  ['mail', 'Mail', "You've got mail."],
  ['blockfall', 'Arcade', 'Snake, Minefield, Blockfall and a Pixel Pet.']
];
const $ = (s) => document.querySelector(s), lb = $('#lb'), big = $('#big');
let cur = 0, opener = null;
SHOTS.forEach(([f, t], i) => {
  const fig = document.createElement('figure'), b = document.createElement('button'), im = new Image(), cap = document.createElement('figcaption');
  b.type = 'button'; b.setAttribute('aria-label', 'Open ' + t); im.src = 'screenshots/thumbs/' + f + '.jpg'; im.alt = t; cap.textContent = t;
  b.append(im); b.onclick = () => { opener = b; show(i); lb.classList.add('open'); $('#x').focus(); }; fig.append(b, cap); $('#grid').appendChild(fig);
});
function show(i) {
  cur = (i + SHOTS.length) % SHOTS.length; const [f, t, s] = SHOTS[cur];
  big.src = 'screenshots/' + f + '.png'; big.alt = t + '. ' + s; $('#ttl').textContent = t; $('#sub').textContent = s; $('#n').textContent = (cur + 1) + ' / ' + SHOTS.length;
  try { history.replaceState(null, '', '#' + f); } catch (e) { /* file:// */ }
  new Image().src = 'screenshots/' + SHOTS[(cur + 1) % SHOTS.length][0] + '.png';
}
function close() { lb.classList.remove('open'); try { history.replaceState(null, '', location.pathname); } catch (e) { /* file:// */ } if (opener) opener.focus(); }
$('#prev').onclick = () => show(cur - 1); $('#next').onclick = () => show(cur + 1); $('#x').onclick = close;
lb.addEventListener('click', (e) => { if (e.target === lb) close(); });
addEventListener('keydown', (e) => { if (!lb.classList.contains('open')) return; if (e.key === 'ArrowRight') show(cur + 1); else if (e.key === 'ArrowLeft') show(cur - 1); else if (e.key === 'Escape') close(); });
let x0 = null; big.addEventListener('touchstart', (e) => { x0 = e.touches[0].clientX; }, {passive: true});
big.addEventListener('touchend', (e) => { if (x0 == null) return; const d = e.changedTouches[0].clientX - x0; x0 = null; if (Math.abs(d) > 40) show(cur + (d < 0 ? 1 : -1)); });
const start = SHOTS.findIndex((s) => s[0] === location.hash.slice(1)); if (start >= 0) { show(start); lb.classList.add('open'); }
</script>
</body>
</html>
